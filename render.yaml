services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /actuator/health

    envVars:
      # PostgreSQL / Neon
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Redis / Upstash
      - key: SPRING_DATA_REDIS_URL
        sync: false

      # Kafka / Aiven
      - key: KAFKA_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: KAFKA_SSL_TRUSTSTORE_TYPE
        value: PEM
      - key: KAFKA_SSL_TRUSTSTORE_CERTIFICATES
        sync: false

      # JWT authentication
      - key: JWT_SECRET
        sync: false

      # Google authentication
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Public short-link origin. This is intentionally independent of the
      # Render API origin and can move to a custom domain later.
      - key: APP_PUBLIC_BASE_URL
        value: "https://trimly.s-ibrahim-devx.workers.dev"

      # API rate limiting
      - key: RATE_LIMIT
        value: "20"
