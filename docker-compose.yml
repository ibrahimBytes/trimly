services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:15-alpine

    container_name: trimly_postgres

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener_user
      POSTGRES_PASSWORD: url_shortener_pass

      # PostgreSQL listens on 5431 inside the container
      PGPORT: 5431

    ports:
      - "5431:5431"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - trimly_network

    restart: unless-stopped


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:latest

    container_name: trimly_redis

    ports:
      - "6380:6379"

    networks:
      - trimly_network

    restart: unless-stopped


  # ============================================================
  # Kafka
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0

    container_name: trimly_kafka

    ports:
      - "9092:9092"

    environment:

      # --------------------------------------------------------
      # KRaft configuration
      # --------------------------------------------------------
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      # --------------------------------------------------------
      # Listeners
      # --------------------------------------------------------
      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:29093,
        EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        PLAINTEXT:PLAINTEXT,
        CONTROLLER:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --------------------------------------------------------
      # Single-node Kafka settings
      # --------------------------------------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --------------------------------------------------------
      # Kafka cluster ID
      # --------------------------------------------------------
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

    networks:
      - trimly_network

    restart: unless-stopped


# ==============================================================
# Persistent volumes
# ==============================================================

volumes:
  pgdata:


# ==============================================================
# Network
# ==============================================================

networks:
  trimly_network:
    driver: bridge